name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # One Python per non-Linux runner is enough. What varies across
          # platforms here is path resolution and the os module, not the version.
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -q

  examples:
    # The README quotes this output. If an example stops running, the README is
    # wrong and nobody finds out from the unit tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked
      - run: uv run python examples/plan_it.py || [ $? -eq 1 ]
      - run: uv run python examples/guard_it.py
      - run: uv run pytest examples/test_purity.py -q -p consequence

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
